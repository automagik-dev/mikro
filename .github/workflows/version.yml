name: SDK Package

# Single source of SDK-only npm publishing for @automagik/rlmx.
#
# npm is NOT the canonical CLI/application release channel. End-user CLI
# installs and updates are git-managed through scripts/install.sh and
# `rlmx update`, with public `main` as the release boundary after a reviewed
# topic-branch -> main merge.
#
#   Trigger                              Context  npm tag   Bump?
#   -----------------------------------  -------  --------  ------
#   workflow_run (CI success on dev)     SDK dev  @next     yes   <- DORMANT
#   workflow_run (merge PR to main)      SDK main @latest   no
#   workflow_dispatch (manual)           SDK dev  @next     yes
#
# NOTE (2026-07-25): there is no `dev` branch on origin. Topic branches
# (wish/*, fix/*, feat/*, chore/*) merge directly into main, so the `dev` ->
# @next path below never fires. That is why the `next` dist-tag has been
# frozen at 0.260528.1 while `latest` moved on. The `dev` trigger is retained
# but inert; if @next publishing is wanted again, either create a `dev` branch
# or repoint this at the topic-branch flow. Until then, `next` must be
# repointed manually so it never trails `latest`:
#   npm dist-tag add @automagik/rlmx@<version> next
#
# On dev triggers we DERIVE a fresh version (today + build-count),
# commit + tag + push back to dev, then publish as @next.
#
# On main triggers we DO NOT bump — package.json already carries the version
# tagged before the merge. We just publish that exact SDK artifact as @latest,
# so npm and GitHub Release metadata agree. The CLI/application release already
# happened when the protected merge into main made the commit reachable to
# scripts/install.sh and `rlmx update`.
#
# Auth: npm OIDC Trusted Publishing. The package's only Trusted
# Publisher entry on npmjs.com is THIS file (version.yml). All other
# workflows defer to this one for npm publishing. Mirrors the genie
# repo's setup (genie/.github/workflows/version.yml).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write   # required for npm OIDC trusted-publisher token exchange

concurrency:
  group: version-${{ github.event.workflow_run.head_branch || 'manual' }}
  cancel-in-progress: false

jobs:
  auto-version:
    name: Auto Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       !contains(github.event.workflow_run.head_commit.message, '[auto-version]') &&
       !contains(github.event.workflow_run.head_commit.message, '[skip ci]') &&
       (
         github.event.workflow_run.head_branch == 'main'
         ||
         github.event.workflow_run.head_branch == 'dev'
       ))

    steps:
      - name: Determine branch and version prefix
        id: context
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch || 'dev' }}"
          if [ "$BRANCH" = "main" ]; then
            # Main push: publish whatever dev already tagged. Do NOT bump.
            echo "branch=main" >> "$GITHUB_OUTPUT"
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
            echo "should_bump=false" >> "$GITHUB_OUTPUT"
          else
            # Dev push (or manual dispatch): derive + bump + publish @next.
            echo "branch=dev" >> "$GITHUB_OUTPUT"
            echo "npm_tag=next" >> "$GITHUB_OUTPUT"
            echo "should_bump=true" >> "$GITHUB_OUTPUT"
          fi
          echo "prefix=0" >> "$GITHUB_OUTPUT"
          echo "Resolved: branch=${BRANCH}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.context.outputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Node 24 ships npm 11.5+ which has OIDC trusted-publisher support
      # built in. Avoids the `npm install -g npm@latest` self-upgrade bug
      # (Arborist clobbering its own promise-retry dep mid-install) that
      # broke our 0.260425.1 publish on Node 22 + ubuntu-latest.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Configure git
        if: steps.context.outputs.should_bump == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Derive version
        id: version
        if: steps.context.outputs.should_bump == 'true'
        run: |
          PREFIX="${{ steps.context.outputs.prefix }}"
          TODAY=$(date -u +%y%m%d)
          EXISTING=$(git tag --list "v${PREFIX}.${TODAY}.*" | wc -l)
          BUILD_NUMBER=$((EXISTING + 1))
          VERSION="${PREFIX}.${TODAY}.${BUILD_NUMBER}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Derived version: ${VERSION}"

      - name: Sync all version files
        if: steps.context.outputs.should_bump == 'true'
        run: npm run bump-version
        env:
          RLMX_BUILD_NUMBER: ${{ steps.version.outputs.build_number }}

      - name: Commit and tag
        if: steps.context.outputs.should_bump == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="${{ steps.context.outputs.branch }}"

          git add -A '*.json' 'src/version.ts'
          if git diff --cached --quiet; then
            echo "No version changes to commit"
          else
            git commit -m "chore(version): bump to ${VERSION} [auto-version]"
          fi

          git tag "v${VERSION}"
          git push --atomic origin "HEAD:refs/heads/${BRANCH}" "refs/tags/v${VERSION}"

      # On main context we publish whatever package.json currently holds as
      # SDK metadata/artifacts only. This must not be treated as the CLI app
      # release authority.
      - name: Resolve publish version
        id: pubver
        run: |
          if [ "${{ steps.context.outputs.should_bump }}" = "true" ]; then
            VERSION="${{ steps.version.outputs.version }}"
          else
            VERSION=$(jq -r '.version' package.json)
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${VERSION} with tag ${{ steps.context.outputs.npm_tag }}"

      - name: Build
        run: npm run build

      - name: Verify npm version supports OIDC trusted publishing
        run: |
          NPM_VERSION=$(npm --version)
          echo "npm version: ${NPM_VERSION}"
          # OIDC trusted publishing requires npm >= 11.5.1.
          MAJOR=$(echo "${NPM_VERSION}" | cut -d. -f1)
          if [ "${MAJOR}" -lt 11 ]; then
            echo "::error::npm ${NPM_VERSION} too old — OIDC requires >= 11.5.1. Bump node-version above."
            exit 1
          fi

      - name: Publish to npm via OIDC
        env:
          # npm auto-enables provenance in any CI env with `id-token: write`.
          # On Blacksmith runners the server-side sigstore check fails with
          # 422; on GitHub-hosted runners (this workflow) it usually works,
          # but disable it explicitly to keep the contract identical to genie
          # and avoid surprise failures. OIDC token exchange still happens.
          NPM_CONFIG_PROVENANCE: "false"
        # On main context: publish package.json's current SDK version as
        # @latest (no bump, matches what dev already tagged).
        # On dev context: publish the SDK version we just bumped to as @next.
        run: |
          VERSION="${{ steps.pubver.outputs.version }}"
          TAG="${{ steps.context.outputs.npm_tag }}"
          if ! npm publish --access public --tag "$TAG" 2>&1; then
            echo "Publish failed (likely already published) — adding dist-tag $TAG..."
            npm dist-tag add "@automagik/rlmx@${VERSION}" "$TAG"
          fi
