name: Release Metadata

# GitHub Releases are optional metadata cut from package.json's version only.
# They are not the CLI/application release authority. The app release boundary
# is the reviewed topic-branch -> main merge consumed by scripts/install.sh and
# `rlmx update`. (There is no `dev` branch; see docs/release-contract.md.)
# Do not derive ad-hoc hotfix release tags in this workflow: npm publishing
# uses the same SDK package version in version.yml, and rlmx --version reads
# src/version.ts generated from that package version. If the exact release
# already exists, skip; a new metadata release requires an explicit version bump.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    if: "!startsWith(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve package release version
        id: ver
        run: |
          VERSION=$(jq -r '.version' package.json)
          TAG="v${VERSION}"

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::package.json version is empty"
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release tag resolved from package.json: ${TAG}"

      - name: Check release does not already exist
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${TAG} already exists — skipping. Bump package.json/src/version.ts first to cut a new release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Find previous release tag
        id: prev
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          PREV=$(gh release list --limit 50 --json tagName -q '.[].tagName' | grep -v "^${TAG}$" | head -1 || true)
          if [ -n "$PREV" ] && git merge-base --is-ancestor "$PREV" HEAD 2>/dev/null; then
            echo "tag=${PREV}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: cliff
        if: steps.existing.outputs.exists == 'false' && steps.prev.outputs.tag != ''
        with:
          config: cliff.toml
          args: ${{ format('{0}..HEAD', steps.prev.outputs.tag) }}
        env:
          GITHUB_REPO: ${{ github.repository }}

      - name: Create release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ steps.cliff.outputs.content }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if [ -z "$RELEASE_NOTES" ]; then
            RELEASE_NOTES="RLMX release metadata for the main branch application boundary and SDK package version."
          fi
          printf '%s' "$RELEASE_NOTES" > /tmp/release-notes.md
          gh release create "${TAG}" \
            --target "${{ github.sha }}" \
            --title "${TAG}" \
            --notes-file /tmp/release-notes.md
