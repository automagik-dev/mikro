name: Rolling PR Maintenance

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: rolling-pr
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check/Create Rolling PR
        env:
          # Use the built-in workflow token. A stale custom token should not make
          # the release-boundary helper fail with 401 on scheduled runs.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PR=$(gh pr list --repo ${{ github.repository }} --base main --head dev --state open --json number --jq '.[0].number // ""')
          if [ -n "$PR" ]; then
            echo "Rolling PR #$PR exists and is up to date"
            exit 0
          fi

          if [ "$(gh api repos/${{ github.repository }}/compare/main...dev --jq '.ahead_by')" = "0" ]; then
            echo "dev has no commits ahead of main; no rolling PR needed"
            exit 0
          fi

          gh pr create --repo ${{ github.repository }} \
              --base main --head dev \
              --title "chore: rolling promotion dev -> main" \
              --body "$(cat <<'BODY'
          ## Rolling Promotion PR

          Auto-maintained rolling promotion PR from \`dev\` to \`main\`.

          Merging this PR is the canonical RLMX application release boundary.
          Git-installed CLIs receive this commit through \`scripts/install.sh\`
          or \`rlmx update\`. npm remains SDK-only.

          **Process:**
          - This PR is automatically created and kept open
          - Human reviews and merges when ready
          - Label \`ready-to-merge\` added when all checks pass

          > **IMPORTANT: Merge with "Create a merge commit" — NEVER squash.**
          > Squash merging breaks history sync between dev and main,
          > causing the next rolling PR to show all commits again.

          > Human approval required for merge to production.
          BODY
          )"
          echo "Created new rolling PR"
